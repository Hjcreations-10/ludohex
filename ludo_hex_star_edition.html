<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Hex Star Edition - 3D Hexagonal Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Hexagonal Clip Path Utilities */
    .hex-shape {
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .hex-card {
      clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
    }

    /* Modal Setup & Event Overlay */
    #setup-modal, #event-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    #event-modal {
      z-index: 150;
      display: none;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 28px 36px;
      text-align: center;
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.3);
      max-width: 440px;
      width: 92%;
      animation: hexPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    @keyframes hexPop {
      0% { transform: scale(0.6) rotate(-5deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .modal-card h2 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .modal-card p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .player-opt-btn, .modal-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.9);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .player-opt-btn:hover, .modal-btn:hover {
      background: #0284c7;
      border-color: #7dd3fc;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* Event Card Special Styles */
    .event-card {
      border-width: 3px;
    }
    .event-card.luck {
      border-color: #22c55e;
      box-shadow: 0 0 50px rgba(34, 197, 94, 0.45);
    }
    .event-card.risk {
      border-color: #ef4444;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.45);
    }
    .event-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .event-badge.luck { background: rgba(22, 101, 52, 0.8); color: #4ade80; border: 1px solid #22c55e; }
    .event-badge.risk { background: rgba(153, 27, 27, 0.8); color: #fca5a5; border: 1px solid #ef4444; }

    /* Header Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 560px;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .app-title-badge {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 2px solid #38bdf8;
      border-radius: 30px;
      padding: 6px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-title-badge h1 {
      color: #38bdf8;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .icon-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: scale(1.05);
    }

    /* Hex Layout Grid Container */
    #game-arena {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Player Hex Badges */
    .players-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .player-card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .player-card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }
    .avatar-hex {
      width: 40px;
      height: 40px;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .player-score {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .p-red { background: linear-gradient(135deg, rgba(127, 29, 29, 0.8) 0%, rgba(30, 41, 59, 0.9) 100%); }
    .p-green { background: linear-gradient(135deg, rgba(20, 83, 45, 0.8) 0%, rgba(30, 41, 59, 0.9) 100%); }
    .p-blue { background: linear-gradient(135deg, rgba(30, 58, 138, 0.8) 0%, rgba(30, 41, 59, 0.9) 100%); }
    .p-yellow { background: linear-gradient(135deg, rgba(113, 63, 18, 0.8) 0%, rgba(30, 41, 59, 0.9) 100%); }

    /* Hexagonal Frame & Board Container */
    .hex-board-outer {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px;
      padding: 14px;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.1), 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(56, 189, 248, 0.15);
      border: 2px solid rgba(56, 189, 248, 0.3);
      position: relative;
    }

    canvas {
      background: #020617;
      border-radius: 16px;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      touch-action: manipulation;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* Control Bar with Glass Pod */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 24px;
      padding: 10px 18px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    .dice-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Hex Glass Pod for Dice */
    .hex-dice-pod {
      width: 64px;
      height: 64px;
      background: rgba(30, 41, 59, 0.6);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .turn-pill {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    .turn-pill-dot {
      width: 12px;
      height: 12px;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: #ef4444;
      box-shadow: 0 0 8px currentColor;
    }

    /* 3D GLOSSY CUBE DIE */
    .dice-scene {
      width: 48px;
      height: 48px;
      perspective: 400px;
      cursor: pointer;
      position: relative;
    }
    .dice-scene:active {
      transform: scale(0.95);
    }
    
    .cube-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-24px) rotateX(-25deg) rotateY(32deg);
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1.15);
    }

    .cube-3d.rolling {
      animation: tumble3D 0.6s linear infinite;
    }

    @keyframes tumble3D {
      0%   { transform: translateZ(-24px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      25%  { transform: translateZ(-24px) rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
      50%  { transform: translateZ(-24px) rotateX(270deg) rotateY(270deg) rotateZ(180deg); }
      75%  { transform: translateZ(-24px) rotateX(360deg) rotateY(180deg) rotateZ(270deg); }
      100% { transform: translateZ(-24px) rotateX(540deg) rotateY(360deg) rotateZ(360deg); }
    }

    .cube-face {
      position: absolute;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle at 35% 25%, #ffffff 0%, #f1f5f9 55%, #cbd5e1 90%, #94a3b8 100%);
      border-radius: 10px;
      box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.9),
                  inset -2px -2px 6px rgba(0, 0, 0, 0.2),
                  inset 2px 2px 5px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(220, 226, 235, 0.8);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 5px;
    }

    .cube-face::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%);
      border-radius: 8px 8px 50% 50%;
      pointer-events: none;
    }

    .face-1 { transform: rotateY(0deg) translateZ(24px); }
    .face-6 { transform: rotateY(180deg) translateZ(24px); }
    .face-2 { transform: rotateY(-90deg) translateZ(24px); }
    .face-5 { transform: rotateY(90deg) translateZ(24px); }
    .face-3 { transform: rotateX(90deg) translateZ(24px); }
    .face-4 { transform: rotateX(-90deg) translateZ(24px); }

    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: auto;
      background: radial-gradient(circle at 40% 40%, #1e293b 0%, #090d14 70%, #000000 100%);
      box-shadow: inset 1px 2px 3px rgba(0, 0, 0, 0.95),
                  0 0.5px 1px rgba(255, 255, 255, 0.8);
    }

    .face-1 .pip { grid-area: 2 / 2; }
    .face-2 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-2 .pip:nth-child(2) { grid-area: 3 / 3; }
    .face-3 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-3 .pip:nth-child(2) { grid-area: 2 / 2; }
    .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }
    .face-4 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-4 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-4 .pip:nth-child(3) { grid-area: 3 / 1; }
    .face-4 .pip:nth-child(4) { grid-area: 3 / 3; }
    .face-5 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-5 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-5 .pip:nth-child(3) { grid-area: 2 / 2; }
    .face-5 .pip:nth-child(4) { grid-area: 3 / 1; }
    .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }
    .face-6 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-6 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-6 .pip:nth-child(3) { grid-area: 2 / 1; }
    .face-6 .pip:nth-child(4) { grid-area: 2 / 3; }
    .face-6 .pip:nth-child(5) { grid-area: 3 / 1; }
    .face-6 .pip:nth-child(6) { grid-area: 3 / 3; }

    .roll-btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: white;
      border: 1px solid #7dd3fc;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .roll-btn:hover {
      background: linear-gradient(180deg, #7dd3fc 0%, #0369a1 100%);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Modal for Setup -->
  <div id="setup-modal">
    <div class="modal-card">
      <h2>⬡ LUDO HEX ARENA ⬡</h2>
      <p>Select player count to start the 3D Hexagonal match:</p>
      <button class="player-opt-btn" onclick="startGame(2)">2 Players (Red vs Yellow)</button>
      <button class="player-opt-btn" onclick="startGame(3)">3 Players (Red, Green, Yellow)</button>
      <button class="player-opt-btn" onclick="startGame(4)">4 Players (Full Hex Battle)</button>
    </div>
  </div>

  <!-- Modal for Risk / Luck Event Pop-up -->
  <div id="event-modal">
    <div id="event-card-body" class="modal-card event-card">
      <div id="event-badge" class="event-badge">LUCK 🍀</div>
      <h2 id="event-title">Hex Lucky Boost!</h2>
      <p id="event-desc">You stepped on a Hex Star tile and triggered a +3 step forward boost!</p>
      <button class="modal-btn" onclick="closeEventModal()">CONTINUE</button>
    </div>
  </div>

  <!-- Header Bar -->
  <header>
    <button class="icon-btn" onclick="showSetup()">⚙️</button>
    <div class="app-title-badge">
      <span>⬡</span>
      <h1>Ludo Hex Arena</h1>
      <span>⬡</span>
    </div>
    <button class="icon-btn" onclick="resetMatch()">🔄</button>
  </header>

  <!-- Game Arena Dashboard -->
  <div id="game-arena">
    <!-- Top Player Row -->
    <div class="players-row">
      <div id="card-0" class="player-card p-red active">
        <div class="avatar-hex" style="background:#dc2626;">👧</div>
        <div class="player-info">
          <span class="player-name">Player 1</span>
          <span class="player-score" id="score-0">Home: 0/4</span>
        </div>
      </div>
      <div id="card-1" class="player-card p-green">
        <div class="avatar-hex" style="background:#16a34a;">👦</div>
        <div class="player-info">
          <span class="player-name">Player 2</span>
          <span class="player-score" id="score-1">Home: 0/4</span>
        </div>
      </div>
    </div>

    <!-- Hexagonal Board Frame -->
    <div class="hex-board-outer">
      <canvas id="ludoBoard" width="600" height="600"></canvas>
    </div>

    <!-- Hex Control Bar -->
    <div class="control-bar">
      <div class="dice-container">
        <div class="hex-dice-pod">
          <div class="dice-scene" onclick="userRollDice()" title="Tap to Roll 3D Die">
            <div id="cube" class="cube-3d">
              <div class="cube-face face-1"><div class="pip"></div></div>
              <div class="cube-face face-2"><div class="pip"></div><div class="pip"></div></div>
              <div class="cube-face face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
              <div class="cube-face face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
              <div class="cube-face face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
              <div class="cube-face face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            </div>
          </div>
        </div>

        <button class="roll-btn" onclick="userRollDice()">ROLL</button>
      </div>

      <div class="turn-pill">
        <div id="turn-dot" class="turn-pill-dot" style="background:#dc2626;"></div>
        <span id="status-text">Player 1's Turn</span>
      </div>

      <button class="icon-btn" onclick="toggleAudio()">🔊</button>
    </div>

    <!-- Bottom Player Row -->
    <div class="players-row">
      <div id="card-3" class="player-card p-blue">
        <div class="avatar-hex" style="background:#2563eb;">👩</div>
        <div class="player-info">
          <span class="player-name">Player 3</span>
          <span class="player-score" id="score-3">Home: 0/4</span>
        </div>
      </div>
      <div id="card-2" class="player-card p-yellow">
        <div class="avatar-hex" style="background:#ca8a04;">👨</div>
        <div class="player-info">
          <span class="player-name">Player 4</span>
          <span class="player-score" id="score-2">Home: 0/4</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('ludoBoard');
    const ctx = canvas.getContext('2d');
    const sz = 600;
    const center = { x: 300, y: 300 };
    const hexR = 24; // Hex Radius for tile rendering

    // Color definitions
    const C_RED = '#ef4444';
    const C_GREEN = '#22c55e';
    const C_YELLOW = '#eab308';
    const C_BLUE = '#3b82f6';

    let activePlayerCount = 4;
    let turn = 0;
    let diceVal = 6;
    let hasRolled = false;
    let isRolling = false;
    let audioEnabled = true;

    const playerColors = [C_RED, C_GREEN, C_YELLOW, C_BLUE];
    const playerNames = ['Player 1', 'Player 2', 'Player 4', 'Player 3'];

    const faceRotations = {
      1: { x: 0,   y: 0 },
      2: { x: 0,   y: 90 },
      3: { x: -90, y: 0 },
      4: { x: 90,  y: 0 },
      5: { x: 0,   y: -90 },
      6: { x: 0,   y: 180 }
    };

    // -------------------------------------------------------------
    // HEXAGONAL GRID COORDINATE TOPOLOGY
    // -------------------------------------------------------------
    // 6 Hexagonal Arm vectors around center
    const armAngles = [
      Math.PI * 7 / 6, // Top-Left (Red)
      Math.PI * 11 / 6, // Top-Right (Green)
      Math.PI * 1 / 2,  // Bottom-Right (Yellow)
      Math.PI * 5 / 6,  // Bottom-Left (Blue)
    ];

    // Generate 48 Main Outer Hex Loop Nodes
    let mainTrack = [];
    let homePaths = [];
    let yardBases = [];
    let safeSpotIndices = [0, 6, 12, 18, 24, 30, 36, 42];
    let starBlockTypes = {};

    function generateHexBoardTopology() {
      mainTrack = [];
      const numNodes = 48;
      const radius = 220;

      for (let i = 0; i < numNodes; i++) {
        let angle = (i / numNodes) * Math.PI * 2 - Math.PI / 2;
        // Wavy hex-polygon distortion for authentic hex-loop feel
        let rMod = radius * (1 + 0.08 * Math.cos(6 * angle));
        mainTrack.push({
          x: center.x + Math.cos(angle) * rMod,
          y: center.y + Math.sin(angle) * rMod
        });
      }

      // Generate Home Stretches inward towards center
      homePaths = [];
      const startAngles = [-Math.PI * 3 / 4, -Math.PI / 4, Math.PI / 4, Math.PI * 3 / 4];
      for (let p = 0; p < 4; p++) {
        let path = [];
        let a = startAngles[p];
        for (let step = 1; step <= 6; step++) {
          let dist = 180 - step * 24;
          path.push({
            x: center.x + Math.cos(a) * dist,
            y: center.y + Math.sin(a) * dist
          });
        }
        homePaths.push(path);
      }

      // Yard Bases in Hex Corners
      yardBases = [
        { x: 100, y: 100, color: C_RED },
        { x: 500, y: 100, color: C_GREEN },
        { x: 500, y: 500, color: C_YELLOW },
        { x: 100, y: 500, color: C_BLUE }
      ];

      // Safe spot initial states
      safeSpotIndices.forEach((idx, i) => {
        starBlockTypes[i] = (i % 2 === 0) ? 'luck' : 'risk';
      });
    }

    let players = [];
    let pendingEventCallback = null;

    function initPlayers() {
      generateHexBoardTopology();
      players = [
        { id: 0, color: C_RED, active: true, startIdx: 0, yard: [{dx:-18,dy:-18},{dx:18,dy:-18},{dx:-18,dy:18},{dx:18,dy:18}], tokens: [-1, -1, -1, -1] },
        { id: 1, color: C_GREEN, active: activePlayerCount >= 3, startIdx: 12, yard: [{dx:-18,dy:-18},{dx:18,dy:-18},{dx:-18,dy:18},{dx:18,dy:18}], tokens: [-1, -1, -1, -1] },
        { id: 2, color: C_YELLOW, active: true, startIdx: 24, yard: [{dx:-18,dy:-18},{dx:18,dy:-18},{dx:-18,dy:18},{dx:18,dy:18}], tokens: [-1, -1, -1, -1] },
        { id: 3, color: C_BLUE, active: activePlayerCount === 4, startIdx: 36, yard: [{dx:-18,dy:-18},{dx:18,dy:-18},{dx:-18,dy:18},{dx:18,dy:18}], tokens: [-1, -1, -1, -1] }
      ];
      if (activePlayerCount === 2) {
        players[1].active = false;
        players[3].active = false;
      }
    }

    // Audio Engine
    function playSound(type) {
      if (!audioEnabled) return;
      try {
        const ctxA = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.connect(gain);
        gain.connect(ctxA.destination);

        if (type === 'roll') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(340, ctxA.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctxA.currentTime + 0.18);
          gain.gain.setValueAtTime(0.25, ctxA.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctxA.currentTime + 0.18);
          osc.start(); osc.stop(ctxA.currentTime + 0.18);
        } else if (type === 'move') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, ctxA.currentTime);
          gain.gain.setValueAtTime(0.2, ctxA.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctxA.currentTime + 0.08);
          osc.start(); osc.stop(ctxA.currentTime + 0.08);
        } else if (type === 'risk' || type === 'kill') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(580, ctxA.currentTime);
          osc.frequency.linearRampToValueAtTime(120, ctxA.currentTime + 0.28);
          gain.gain.setValueAtTime(0.3, ctxA.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctxA.currentTime + 0.28);
          osc.start(); osc.stop(ctxA.currentTime + 0.28);
        } else if (type === 'luck') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, ctxA.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctxA.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctxA.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctxA.currentTime + 0.35);
          osc.start(); osc.stop(ctxA.currentTime + 0.35);
        }
      } catch (e) {}
    }

    function toggleAudio() { audioEnabled = !audioEnabled; }
    function showSetup() { document.getElementById('setup-modal').style.display = 'flex'; }
    function startGame(count) {
      activePlayerCount = count;
      document.getElementById('setup-modal').style.display = 'none';
      resetMatch();
    }

    function resetMatch() {
      initPlayers();
      turn = 0;
      hasRolled = false;
      isRolling = false;
      diceVal = 6;
      setCubeFace(6);
      updateUI();
      drawBoard();
    }

    // -------------------------------------------------------------
    // CANVAS DRAWING FUNCTIONS (HEX TILES & PAWNS)
    // -------------------------------------------------------------
    function drawHexagon(x, y, r, fillColor, strokeColor, strokeWidth = 1.5) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        let a = (i * Math.PI) / 3;
        let hx = x + r * Math.cos(a);
        let hy = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.fill();
      }
      if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = strokeWidth;
        ctx.stroke();
      }
    }

    function drawBoard() {
      ctx.clearRect(0, 0, sz, sz);

      // 1. Draw Outer Hex Ring / Board Grid BG
      drawHexagon(center.x, center.y, 280, '#090d16', 'rgba(56, 189, 248, 0.25)', 3);

      // 2. Draw Hex Base Yards
      yardBases.forEach((yb, i) => {
        drawHexagon(yb.x, yb.y, 65, 'rgba(15, 23, 42, 0.95)', yb.color, 3);
        // Yard Token Pedestals
        players[i].yard.forEach(spot => {
          drawHexagon(yb.x + spot.dx, yb.y + spot.dy, 12, yb.color, '#ffffff', 1);
        });
      });

      // 3. Draw Central Home Hex Hub
      drawHexagon(center.x, center.y, 50, '#0f172a', '#38bdf8', 3);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('HUB', center.x, center.y + 4);

      // 4. Draw Main Outer Track Hex Tiles
      mainTrack.forEach((pt, idx) => {
        let safePosIdx = safeSpotIndices.indexOf(idx);
        if (safePosIdx !== -1) {
          let currentType = starBlockTypes[safePosIdx] || 'luck';
          let starColor = currentType === 'luck' ? '#22c55e' : '#ef4444';
          drawHexagon(pt.x, pt.y, 16, currentType === 'luck' ? 'rgba(34, 197, 94, 0.25)' : 'rgba(239, 68, 68, 0.25)', starColor, 2);
          
          ctx.fillStyle = starColor;
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(currentType === 'luck' ? '🍀' : '⚡', pt.x, pt.y + 4);
        } else {
          drawHexagon(pt.x, pt.y, 15, '#1e293b', 'rgba(255,255,255,0.15)', 1);
        }
      });

      // 5. Draw Home Stretches
      homePaths.forEach((path, pIdx) => {
        path.forEach(pt => {
          drawHexagon(pt.x, pt.y, 14, playerColors[pIdx], '#ffffff', 1);
        });
      });

      // 6. Draw Pawns
      players.forEach(p => {
        if (!p.active) return;
        p.tokens.forEach((tPos, idx) => {
          let coords;
          if (tPos === -1) {
            let yb = yardBases[p.id];
            let spot = p.yard[idx];
            coords = { x: yb.x + spot.dx, y: yb.y + spot.dy };
          } else {
            coords = getTokenCoords(p.id, tPos);
          }
          draw3DHexPawn(coords.x, coords.y, p.color);
        });
      });
    }

    function draw3DHexPawn(x, y, color) {
      // Base Hex Shadow
      drawHexagon(x, y + 6, 12, 'rgba(0, 0, 0, 0.5)', null);

      // Hex Body
      drawHexagon(x, y + 2, 11, color, '#ffffff', 1.5);

      // Gloss Head
      let gradHead = ctx.createRadialGradient(x - 2, y - 6, 1, x, y - 4, 7);
      gradHead.addColorStop(0, '#ffffff');
      gradHead.addColorStop(0.4, color);
      gradHead.addColorStop(1, '#000000');

      ctx.fillStyle = gradHead;
      ctx.beginPath();
      ctx.arc(x, y - 4, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function getTokenCoords(pId, pos) {
      if (pos < 47) {
        let globalIdx = (players[pId].startIdx + pos) % 48;
        return mainTrack[globalIdx];
      } else {
        let homeIdx = Math.min(5, pos - 47);
        return homePaths[pId][homeIdx];
      }
    }

    // -------------------------------------------------------------
    // GAME LOGIC & EVENT CONTROLS
    // -------------------------------------------------------------
    function userRollDice() {
      if (hasRolled || isRolling) return;
      rollDiceLogic();
    }

    function rollDiceLogic() {
      hasRolled = true;
      isRolling = true;
      playSound('roll');

      const cube = document.getElementById('cube');
      cube.classList.add('rolling');

      setTimeout(() => {
        diceVal = Math.floor(Math.random() * 6) + 1;
        cube.classList.remove('rolling');
        setCubeFace(diceVal);
        isRolling = false;
        checkMoves();
      }, 650);
    }

    function setCubeFace(val) {
      const cube = document.getElementById('cube');
      const rot = faceRotations[val];
      cube.style.transform = `translateZ(-24px) rotateX(${rot.x - 18}deg) rotateY(${rot.y + 22}deg)`;
    }

    function checkMoves() {
      let p = players[turn];
      let movableTokens = [];

      p.tokens.forEach((t, idx) => {
        if (t === -1 && diceVal === 6) movableTokens.push(idx);
        else if (t >= 0 && t + diceVal <= 52) movableTokens.push(idx);
      });

      if (movableTokens.length === 0) {
        document.getElementById('status-text').innerText = 'No Moves Available!';
        setTimeout(nextTurn, 1000);
      } else if (movableTokens.length === 1) {
        moveToken(movableTokens[0]);
      } else {
        document.getElementById('status-text').innerText = 'Tap Pawn to Move';
      }
    }

    canvas.addEventListener('click', (e) => {
      if (!hasRolled || isRolling) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (sz / rect.width);
      const clickY = (e.clientY - rect.top) * (sz / rect.height);

      let p = players[turn];
      for (let i = 0; i < p.tokens.length; i++) {
        let tPos = p.tokens[i];
        let coords;
        if (tPos === -1) {
          let yb = yardBases[p.id];
          let spot = p.yard[i];
          coords = { x: yb.x + spot.dx, y: yb.y + spot.dy };
        } else {
          coords = getTokenCoords(p.id, tPos);
        }

        let dist = Math.hypot(coords.x - clickX, coords.y - clickY);
        if (dist < 20) {
          if ((tPos === -1 && diceVal === 6) || (tPos >= 0 && tPos + diceVal <= 52)) {
            moveToken(i);
            break;
          }
        }
      }
    });

    function moveToken(tokenIdx) {
      let p = players[turn];
      playSound('move');

      if (p.tokens[tokenIdx] === -1) {
        p.tokens[tokenIdx] = 0;
      } else {
        p.tokens[tokenIdx] += diceVal;
      }

      let finalPos = p.tokens[tokenIdx];

      // Check Star Tile Landing
      let starPosIdx = -1;
      if (finalPos < 47) {
        let globalIdx = (p.startIdx + finalPos) % 48;
        starPosIdx = safeSpotIndices.indexOf(globalIdx);
      }

      if (starPosIdx !== -1) {
        handleStarBlockEvent(p, tokenIdx, starPosIdx);
      } else {
        processNormalLanding(p, tokenIdx);
      }
    }

    function processNormalLanding(p, tokenIdx) {
      let finalPos = p.tokens[tokenIdx];
      if (finalPos < 47) {
        let globalIdx = (p.startIdx + finalPos) % 48;
        let isSafe = safeSpotIndices.includes(globalIdx);

        if (!isSafe) {
          players.forEach(otherP => {
            if (otherP.id !== turn && otherP.active) {
              otherP.tokens.forEach((ot, otIdx) => {
                if (ot >= 0 && ot < 47) {
                  let otherGlobalIdx = (otherP.startIdx + ot) % 48;
                  if (otherGlobalIdx === globalIdx) {
                    otherP.tokens[otIdx] = -1;
                    playSound('kill');
                    document.getElementById('status-text').innerText = 'Hex Pawn Captured!';
                  }
                }
              });
            }
          });
        }
      }

      drawBoard();
      updateUI();

      if (diceVal === 6) {
        hasRolled = false;
        document.getElementById('status-text').innerText = 'Bonus Roll!';
      } else {
        setTimeout(nextTurn, 700);
      }
    }

    function handleStarBlockEvent(player, tokenIdx, starIdx) {
      let currentType = starBlockTypes[starIdx] || 'luck';

      // Cycle Hex Star block state for next player
      starBlockTypes[starIdx] = currentType === 'luck' ? 'risk' : 'luck';

      let title = "";
      let desc = "";
      let isLuck = (currentType === 'luck');

      if (isLuck) {
        playSound('luck');
        let luckRoll = Math.floor(Math.random() * 2);
        if (luckRoll === 0) {
          let boost = Math.floor(Math.random() * 3) + 2;
          player.tokens[tokenIdx] = Math.min(52, player.tokens[tokenIdx] + boost);
          title = "🍀 Hex Lucky Boost!";
          desc = `Stepped on a Luck Hex Star! Boosted forward +${boost} extra tiles.`;
        } else {
          title = "🍀 Hex Extra Roll!";
          desc = "Stepped on a Luck Hex Star! Gained an immediate extra turn roll.";
          hasRolled = false;
        }
      } else {
        playSound('risk');
        let riskRoll = Math.floor(Math.random() * 2);
        if (riskRoll === 0) {
          let setback = Math.floor(Math.random() * 3) + 2;
          player.tokens[tokenIdx] = Math.max(0, player.tokens[tokenIdx] - setback);
          title = "⚡ Risk Star Trap!";
          desc = `Stepped on a Risk Star Trap! Forced back ${setback} hex tiles.`;
        } else {
          player.tokens[tokenIdx] = -1;
          title = "⚡ Risk Return to Base!";
          desc = "Dangerous Risk Trap! Your pawn was dematerialized back to base yard!";
        }
      }

      showEventModal(isLuck, title, desc, () => {
        drawBoard();
        updateUI();
        if (diceVal === 6 || (isLuck && title.includes("Extra Roll"))) {
          hasRolled = false;
          document.getElementById('status-text').innerText = 'Bonus Roll!';
        } else {
          setTimeout(nextTurn, 500);
        }
      });
    }

    function showEventModal(isLuck, title, desc, callback) {
      pendingEventCallback = callback;
      const card = document.getElementById('event-card-body');
      const badge = document.getElementById('event-badge');
      const titleElem = document.getElementById('event-title');
      const descElem = document.getElementById('event-desc');

      if (isLuck) {
        card.className = "modal-card event-card luck";
        badge.className = "event-badge luck";
        badge.innerText = "LUCK STAR 🍀";
      } else {
        card.className = "modal-card event-card risk";
        badge.className = "event-badge risk";
        badge.innerText = "RISK STAR ⚡";
      }

      titleElem.innerText = title;
      descElem.innerText = desc;

      document.getElementById('event-modal').style.display = 'flex';
    }

    function closeEventModal() {
      document.getElementById('event-modal').style.display = 'none';
      if (pendingEventCallback) {
        let cb = pendingEventCallback;
        pendingEventCallback = null;
        cb();
      }
    }

    function nextTurn() {
      hasRolled = false;
      do {
        turn = (turn + 1) % 4;
      } while (!players[turn].active);

      updateUI();
      document.getElementById('status-text').innerText = `${playerNames[turn]}'s Turn`;
    }

    function updateUI() {
      for (let i = 0; i < 4; i++) {
        let card = document.getElementById(`card-${i}`);
        let score = document.getElementById(`score-${i}`);

        if (i === turn) card.classList.add('active');
        else card.classList.remove('active');

        let finished = players[i].tokens.filter(t => t === 52).length;
        score.innerText = `Home: ${finished}/4`;
      }
      document.getElementById('turn-dot').style.background = playerColors[turn];
    }

    initPlayers();
    drawBoard();
  </script>
</body>
